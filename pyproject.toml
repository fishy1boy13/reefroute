[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reefroute"
version = "0.1.0"
description = "A portable text API router with SQLite accounting and capped credentials"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4"]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
reefroute = "reefroute.cli:main"

[tool.setuptools.packages.find]
include = ["reefroute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
